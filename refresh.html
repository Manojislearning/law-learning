<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1321">
<title>Refresh Law Learning</title>
<style>
:root{color-scheme:light}body{font-family:system-ui,-apple-system,sans-serif;background:#f4f5f7;color:#0d1321;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
main{max-width:470px;background:white;border:1px solid #d8dde4;border-radius:18px;padding:26px;box-shadow:0 15px 45px #0d132118;width:100%;box-sizing:border-box}
h1{font-size:1.4rem;margin:0 0 8px}p{font-size:.95rem;line-height:1.65;color:#667180}
small{display:block;color:#667180;margin-top:15px}button{border:0;background:#0d1321;color:white;font:inherit;font-weight:700;border-radius:11px;padding:13px 16px;width:100%;cursor:pointer}
a{color:#22568b}#progress{word-break:break-word}
</style>
</head>
<body>
<main>
<h1>Updating Law Learning</h1>
<p id="progress" role="status" aria-live="polite">Clearing outdated app files while preserving your scores, notes and revision list…</p>
<button id="retry" type="button" hidden>Try again</button>
<small>Build 39 · Only cached files are cleared. Your saved learning progress is not erased.</small>
</main>
<script>
(function(){
"use strict";
var status=document.getElementById("progress"),retry=document.getElementById("retry"),running=false;
async function refresh(){
if(running)return;running=true;retry.hidden=true;
try{
 var registrationList=("serviceWorker" in navigator)?await navigator.serviceWorker.getRegistrations():[];
 var pageBase=new URL("./",location.href).pathname;
 var owned=registrationList.filter(function(r){return new URL(r.scope).pathname.startsWith(pageBase);});
 status.textContent="Removing old offline app version…";
 await Promise.all(owned.map(function(r){return r.unregister();}));
 if("caches" in window){
   var all=await caches.keys();
   await Promise.all(all.filter(function(key){return key.indexOf("law-learning-")===0;}).map(function(k){return caches.delete(k);}));
 }
 status.textContent="Loading the updated website…";
 location.replace("./index.html?build=39&refresh="+Date.now()+"#home");
}catch(error){
 status.textContent="Automatic refresh did not finish. You can try again or open the website in a private tab. "+String(error&&error.message||"");
 retry.hidden=false;running=false;
}
}
retry.addEventListener("click",refresh);
refresh();
})();
</script>
</body>
</html>
