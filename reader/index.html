<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Law Notes</title>
  <meta name="robots" content="noindex" />
  <script>
    /* Law Notes now live inside the main app. Old links (?file=… and ?map=1) keep working. */
    (function(){
      var q=new URLSearchParams(location.search),p=new URLSearchParams();
      if(q.get("file"))p.set("file",q.get("file"));
      if(q.get("map")==="1")p.set("map","1");
      var s=p.toString();
      location.replace("../#lawnotes"+(s?"?"+s:""));
    })();
  </script>
</head>
<body>
  <p>Law Notes have moved into the app. <a href="../#lawnotes">Open Law Notes</a>.</p>
</body>
</html>
