name: App quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Code, curriculum and app smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify app and content
        run: node --test tests/*.test.mjs
      - name: Check browser integration test syntax
        run: node --check tests/dom-smoke.cjs
      - name: Install DOM integration checker
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Verify browser script startup and syllabus navigation
        run: node tests/dom-smoke.cjs
      - name: Verify News navigation, attribution, safe links and bookmarks
        run: node tests/news-dom.cjs
      - name: Verify both vocabulary levels and saved learning history
        run: node tests/word-levels-dom.cjs
      - name: Verify KSLU question archive, answer disclosure and search
        run: node tests/past-paper-dom.cjs

  mobile_browser:
    name: Chromium mobile viewport and keyboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Verify mobile browser test
        run: |
          node --check tests/mobile-browser.cjs
          node tests/mobile-browser.cjs
