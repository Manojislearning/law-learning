name: App quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Code, curriculum and app smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify app and content
        run: node --test tests/*.test.mjs
      - name: Check browser integration test syntax
        run: node --check tests/dom-smoke.cjs
      - name: Install DOM integration checker
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Verify browser script startup and syllabus navigation
        run: node tests/dom-smoke.cjs
