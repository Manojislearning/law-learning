name: Refresh legal news (free RSS)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news.yml'
      - 'scripts/fetch-law-news.py'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: law-news-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate legal RSS headlines
        run: python3 scripts/fetch-law-news.py
      - name: Commit updated news file only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh attributed law news RSS feed"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo 'Failed to publish legal news after four safe retries' >&2
            exit 1
          fi
